{# Walk note modal — edits a booking's client_notes (one note shared with the
   client). Driven by static/js/walk-note-modal.js (WalkNoteModal.open);
   included by the board fragment and Week view. #}
<div class="modal fade" id="walkNoteModal" tabindex="-1" aria-labelledby="walk-note-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <div>
                    <h6 class="modal-title fw-semibold mb-0" id="walk-note-title">
                        <i class="bi bi-pencil-square me-1"></i>Walk note
                    </h6>
                    <div class="text-muted small" id="walk-note-subtitle"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <textarea class="form-control" id="walk-note-text" rows="4" maxlength="500"
                          placeholder="e.g. Bring the long lead — on restricted exercise this week"></textarea>
                <div class="d-flex justify-content-between mt-1 small text-muted">
                    <span>The client sees and can edit this note. Walkers see it on the pickup list.</span>
                    <span id="walk-note-count" class="text-nowrap ms-2">0/500</span>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary btn-sm px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm px-4" id="walk-note-save-btn"
                        aria-label="Save note"><i class="bi bi-floppy me-1"></i>Save</button>
            </div>
        </div>
    </div>
</div>
